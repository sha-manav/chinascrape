name: CLS Telegraph watch

on:
  # GitHub often drops scheduled runs, so a scheduled run stays alive for ~5h40m and checks
  # every 30 minutes itself; the hourly schedule only needs to fire now and then to restart it.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Test: report all matching posts from the last N hours, even if already sent (blank = normal run)"
        required: false
        default: ""
      from_date:
        description: "Backfill: first Beijing date to process, YYYY-MM-DD (one issue per day; leave blank for a normal run)"
        required: false
        default: ""
      to_date:
        description: "Backfill: last Beijing date, YYYY-MM-DD (defaults to from_date)"
        required: false
        default: ""
      dry_run:
        description: "Backfill: only fetch and report how far back the feed reaches (no Claude, no issues)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# One scheduled watcher at a time (extra triggers wait their turn); manual runs never queue behind it.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'cls-watch' || format('cls-manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      # The last-seen position lives in the Actions cache between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: cls-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cls-state-

      - name: Check feed
        id: watch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '340' || '' }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 watch_cls.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: cls-state-${{ github.run_id }}-${{ github.run_attempt }}
